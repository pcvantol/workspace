name: Workspace production release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact already-merged origin/main commit to qualify and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with: {ref: ${{ inputs.source_sha }}, fetch-depth: 0}
      - name: Verify protected source and qualify it
        env: {SOURCE_SHA: ${{ inputs.source_sha }}}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          bash scripts/validate.sh
          python3 scripts/advance_product_version.py --verify-main-release-source --approved-source "$SOURCE_SHA"
      - name: Build exact source bundle and qualify digest
        id: bundle
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("product-version.json"))["version"])')"
          BUNDLE="workspace-${VERSION}-${{ inputs.source_sha }}.tar.gz"
          git archive --format=tar.gz --prefix="workspace-${VERSION}/" HEAD > "$BUNDLE"
          DIGEST="sha256:$(sha256sum "$BUNDLE" | cut -d' ' -f1)"
          printf 'version=%s\nfilename=%s\ndigest=%s\n' "$VERSION" "$BUNDLE" "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub release asset or verify resumable prior publication
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.bundle.outputs.digest }}
          VERSION: ${{ steps.bundle.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="workspace-v$VERSION"
          ASSET="${{ steps.bundle.outputs.filename }}"
          if gh release view "$TAG" --json targetCommitish >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_SHA"
            mkdir existing-release
            gh release download "$TAG" --pattern "$ASSET" --dir existing-release
            test "sha256:$(sha256sum "existing-release/$ASSET" | cut -d' ' -f1)" = "$DIGEST"
          else
            gh release create "$TAG" "$ASSET" --target "$SOURCE_SHA" --title "Workspace $VERSION" --generate-notes
          fi
          PUBLISHED="workspace-published-$VERSION-$SOURCE_SHA.json"
          python3 - "$PUBLISHED" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              'schema_version': 1, 'state': 'PUBLISHED', 'product': 'workspace',
              'version': os.environ['VERSION'], 'source_revision': os.environ['SOURCE_SHA'],
              'artifact_digest': os.environ['DIGEST'], 'registry': 'github-release',
          }, sort_keys=True) + '\n')
          PY
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$PUBLISHED" >/dev/null; then
            mkdir published-readback
            gh release download "$TAG" --pattern "$PUBLISHED" --dir published-readback
            cmp "$PUBLISHED" "published-readback/$PUBLISHED"
          else
            gh release upload "$TAG" "$PUBLISHED"
          fi
      - name: Registry readback and durable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir readback evidence
          TAG="workspace-v$VERSION"
          PUBLISHED="workspace-published-$VERSION-$SOURCE_SHA.json"
          COMPLETE="workspace-release-complete-$VERSION-$SOURCE_SHA.json"
          gh release download "$TAG" --pattern "${{ steps.bundle.outputs.filename }}" --pattern "$PUBLISHED" --dir readback
          test "sha256:$(sha256sum "readback/${{ steps.bundle.outputs.filename }}" | cut -d' ' -f1)" = "${{ steps.bundle.outputs.digest }}"
          python3 - "readback/$PUBLISHED" "evidence/release-complete.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          published = json.loads(Path(sys.argv[1]).read_text())
          expected = {'schema_version': 1, 'state': 'PUBLISHED', 'product': 'workspace',
                      'version': os.environ['VERSION'], 'source_revision': os.environ['SOURCE_SHA'],
                      'artifact_digest': os.environ['DIGEST'], 'registry': 'github-release'}
          if published != expected:
              raise SystemExit('published receipt does not bind the exact release identity')
          Path(sys.argv[2]).write_text(json.dumps({**expected, 'state': 'RELEASE_COMPLETE'}, sort_keys=True)+'\n')
          PY
          cp evidence/release-complete.json "$COMPLETE"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$COMPLETE" >/dev/null; then
            mkdir complete-readback
            gh release download "$TAG" --pattern "$COMPLETE" --dir complete-readback
            cmp "$COMPLETE" "complete-readback/$COMPLETE"
          else
            gh release upload "$TAG" "$COMPLETE"
          fi
          rm -rf existing-release published-readback readback complete-readback
          rm -f "${{ steps.bundle.outputs.filename }}" "$PUBLISHED" "$COMPLETE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a # v7.0.1
        with: {name: workspace-release-evidence-${{ steps.bundle.outputs.version }}, path: evidence/}
