[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcvantol-workspace-control"
dynamic = ["version"]
description = "Workspace Server and read-only browser Client"
requires-python = ">=3.14,<3.15"
license = "LicenseRef-Proprietary"

[project.scripts]
workspace-server = "workspace_control.cli:main"
workspace-client = "workspace_control.cli:client_main"

[tool.setuptools]
packages = ["workspace_control"]

[tool.setuptools.package-data]
workspace_control = ["client.html", "client.js", "client.css", "advisory-conversation-v1.json", "concept-advisory-v1.json", "project-discovery-v1.json", "advisory-candidate-v1.json", "mission-concepts-v1.json", "approved-workset-release-v1.json", "workset-activity-v1.json", "workset-order-v1.json", "project-concept-baseline-input-v1.json", "project-concept-baseline-manifest-v1.json", "proposal-content-decision-v1.json", "execution-progress-v1.json", "inspection-adoptions-v1.json", "inspection-adoption-proposal-v1.json", "genesis-bootstrap-v1.json"]
